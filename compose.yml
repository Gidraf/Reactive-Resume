name: reactive_resume

services:
  # ── Redis (own container — no shared VM instance needed) ──────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Reactive Resume app ────────────────────────────────────────────────────
  reactive_resume:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - app_data:/app/data
    extra_hosts:
      # Allows the container to reach the VM's PostgreSQL on localhost
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  app_data:

networks:
  internal:
