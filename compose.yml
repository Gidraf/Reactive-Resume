name: reactive_resume

# Shared infrastructure, not per-app copies: PostgreSQL and MinIO run on the VM,
# and Redis is the single `redis6381` container from the CVPAP stack, published
# on 127.0.0.1:6381. CVPAP uses database 0; this app uses database 1, so the two
# share one Redis without sharing keys. Running a second Redis here only
# duplicated memory and kept colliding on ports.
#
# REDIS_URL must therefore be:
#   redis://:%40Winners1127@127.0.0.1:6381/1
# (the password contains '@', which has to be percent-encoded as %40 in a URL)

services:
  # ── Reactive Resume app ────────────────────────────────────────────────────
  reactive_resume:
    # image: ghcr.io/reactive-resume/reactive-resume:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CVPAP_API_URL: https://api.ajiriwa.gidraf.dev
    restart: unless-stopped
    # Unrotated json-file logs are what filled /var/lib/docker to 100%.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # Host networking, because PostgreSQL runs on the VM itself. On a
    # user-defined bridge network the container could not route to
    # host.docker.internal (the docker0 gateway, 172.17.0.1) and every boot
    # migration failed with ENETUNREACH. On the host network the database is
    # simply 127.0.0.1:5432 — the same address pg_dump uses — and the app still
    # listens on :3000 for nginx to proxy.
    network_mode: host
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
