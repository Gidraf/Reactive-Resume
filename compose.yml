name: reactive_resume

services:
  # ── Redis (own container — no shared VM instance needed) ──────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Published on loopback only: the app runs with host networking (see below),
    # so it reaches Redis at 127.0.0.1 rather than by service name.
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Reactive Resume app ────────────────────────────────────────────────────
  reactive_resume:
    # image: ghcr.io/reactive-resume/reactive-resume:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CVPAP_API_URL: https://api.ajiriwa.gidraf.dev
    restart: unless-stopped
    # Host networking, because PostgreSQL runs on the VM itself. On a
    # user-defined bridge network the container could not route to
    # host.docker.internal (the docker0 gateway, 172.17.0.1) and every boot
    # migration failed with ENETUNREACH. On the host network the database is
    # simply 127.0.0.1:5432 — the same address pg_dump uses — and the app still
    # listens on :3000 for nginx to proxy.
    network_mode: host
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      start_period: 20s
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  app_data:

networks:
  internal:
