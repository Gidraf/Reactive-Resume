services:
  app:
    image: amruthpillai/reactive-resume:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT_EXTERNAL:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # App runtime
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}

      # Public & storage URLs (point to external host/minio)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${APP_PORT_EXTERNAL:-3000}}
      STORAGE_URL: ${STORAGE_URL:-http://host.docker.internal:9000/${STORAGE_BUCKET:-default}}

      # -- Printer (connect to local/host Chromium) --
      # If your Chromium exposes a devtools websocket on the host, set CHROME_URL accordingly.
      # Example: ws://host.docker.internal:3000    (or ws://localhost:3000 if accessible)
      CHROME_URL: ${CHROME_URL:-ws://host.docker.internal:3000}
      CHROME_TOKEN: ${CHROME_TOKEN:-} # set if your Chromium requires a token

      # -- Database (external Postgres) --
      # Example: postgresql://postgres:password@host.docker.internal:5432/postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/postgres}

      # -- Auth secrets (change) --
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-access_token_secret}   # CHANGEME
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-refresh_token_secret} # CHANGEME

      # -- Emails --
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      # Optional SMTP connection URL, uncomment if you use SMTP:
      # SMTP_URL: ${SMTP_URL:-smtp://user:pass@smtp:587}

      # -- Storage (MinIO / S3) pointing to external MinIO host --
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-host.docker.internal}
      STORAGE_PORT: ${STORAGE_PORT:-9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-default}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}    # CHANGEME
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}    # CHANGEME
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-"false"}
      STORAGE_SKIP_BUCKET_CHECK: ${STORAGE_SKIP_BUCKET_CHECK:-"false"}

      # -- Optional configuration / 3rd party integrations (keep commented or set in .env) --
      # CROWDIN_PROJECT_ID: ${CROWDIN_PROJECT_ID:-}
      # CROWDIN_PERSONAL_TOKEN: ${CROWDIN_PERSONAL_TOKEN:-}

      # GitHub OAuth (optional)
      # GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:${APP_PORT_EXTERNAL:-3000}/api/auth/github/callback}

      # Google OAuth (optional)
      # GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:${APP_PORT_EXTERNAL:-3000}/api/auth/google/callback}

      # OpenID Connect (optional)
      # VITE_OPENID_NAME: ${VITE_OPENID_NAME:-OpenID}
      # OPENID_AUTHORIZATION_URL: ${OPENID_AUTHORIZATION_URL:-}
      # OPENID_CALLBACK_URL: ${OPENID_CALLBACK_URL:-http://localhost:${APP_PORT_EXTERNAL:-3000}/api/auth/openid/callback}
      # OPENID_CLIENT_ID: ${OPENID_CLIENT_ID:-}
      # OPENID_CLIENT_SECRET: ${OPENID_CLIENT_SECRET:-}
      # OPENID_ISSUER: ${OPENID_ISSUER:-}
      # OPENID_SCOPE: ${OPENID_SCOPE:-"openid profile email"}
      # OPENID_TOKEN_URL: ${OPENID_TOKEN_URL:-}
      # OPENID_USER_INFO_URL: ${OPENID_USER_INFO_URL:-}

# No volumes, no local postgres/minio services — this compose expects external resources.
